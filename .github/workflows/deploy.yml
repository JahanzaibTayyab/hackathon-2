# Phase V: CI/CD Pipeline for Todo Application
# Builds, tests, and deploys to Azure AKS with Dapr + Kafka
name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ${{ vars.ACR_REGISTRY }} # e.g., todoappacr.azurecr.io
  FRONTEND_IMAGE: todo-frontend
  BACKEND_IMAGE: todo-backend
  HELM_CHART_PATH: ./helm-chart/todo-app

jobs:
  # ====================
  # Build & Test Job
  # ====================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Frontend Build ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm test --passWithNoTests

      - name: Build frontend
        run: |
          cd frontend
          pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'http://backend-service:8000' }}

      # ---- Backend Build ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync

      - name: Run backend tests
        run: |
          cd backend
          uv run pytest --tb=short
        env:
          DATABASE_URL: sqlite:///./test.db
          BETTER_AUTH_SECRET: test-secret-for-ci

      - name: Lint backend
        run: |
          cd backend
          uv run ruff check src --output-format=github
        continue-on-error: true # Don't fail on lint warnings

  # ====================
  # Docker Build & Push Job
  # ====================
  docker:
    name: Build & Push Docker Images
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate image metadata
        id: meta
        run: |
          echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================
  # Deploy to Staging Job
  # ====================
  deploy-staging:
    name: Deploy to Staging
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Deploy Dapr components
        run: |
          kubectl apply -f helm-chart/dapr-components/cloud/pubsub.yaml -n staging || true
          kubectl apply -f helm-chart/dapr-components/subscription.yaml -n staging || true

      - name: Deploy to Staging
        run: |
          helm upgrade --install todo-app ${{ env.HELM_CHART_PATH }} \
            --namespace staging \
            --create-namespace \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set frontend.image.pullPolicy=Always \
            --set backend.image.repository=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }} \
            --set backend.image.tag=${{ github.sha }} \
            --set backend.image.pullPolicy=Always \
            --set dapr.enabled=true \
            --set kafka.enabled=true \
            -f helm-chart/todo-app/values-staging.yaml \
            --wait \
            --timeout 300s

      - name: Verify deployment
        run: |
          kubectl get pods -n staging
          kubectl get services -n staging

      - name: Run smoke tests
        run: |
          # Wait for pods to be ready
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=backend -n staging --timeout=120s

          # Get service URL (internal test via port-forward)
          echo "Staging deployment successful"

  # ====================
  # Deploy to Production Job
  # ====================
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Deploy Dapr components
        run: |
          kubectl apply -f helm-chart/dapr-components/cloud/pubsub.yaml -n production || true
          kubectl apply -f helm-chart/dapr-components/subscription.yaml -n production || true

      - name: Deploy to Production
        run: |
          helm upgrade --install todo-app ${{ env.HELM_CHART_PATH }} \
            --namespace production \
            --create-namespace \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set frontend.image.pullPolicy=Always \
            --set backend.image.repository=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }} \
            --set backend.image.tag=${{ github.sha }} \
            --set backend.image.pullPolicy=Always \
            --set dapr.enabled=true \
            --set kafka.enabled=true \
            -f helm-chart/todo-app/values-production.yaml \
            --wait \
            --timeout 300s

      - name: Verify deployment
        run: |
          kubectl get pods -n production
          kubectl get services -n production

      - name: Notify deployment success
        run: |
          echo "Production deployment of version ${{ github.sha }} completed successfully!"
          echo "Deployed at: $(date)"
