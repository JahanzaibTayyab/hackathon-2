# Dapr Subscriptions - Route Kafka messages to application endpoints
# Using v2alpha1 format for Dapr 1.16+
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-events-subscription
  namespace: default
spec:
  pubsubname: taskpubsub
  topic: task-events
  routes:
    default: /api/v1/events/tasks
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: reminders-subscription
  namespace: default
spec:
  pubsubname: taskpubsub
  topic: reminders
  routes:
    default: /api/v1/events/reminders
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-updates-subscription
  namespace: default
spec:
  pubsubname: taskpubsub
  topic: task-updates
  routes:
    default: /api/v1/events/task-updates
