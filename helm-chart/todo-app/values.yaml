# Default values for todo-app
# This is a YAML-formatted file for Phase IV Kubernetes deployment

# Frontend (Next.js) configuration
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: todo-frontend
    pullPolicy: Never  # Use local images loaded into Minikube
    tag: "latest"

  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30080

  env:
    - name: NODE_ENV
      value: "production"
    - name: NEXT_PUBLIC_API_URL
      value: "http://backend-service:8000"
    - name: BETTER_AUTH_URL
      value: "http://localhost:30080"
    # Secrets will be mounted from ConfigMap/Secret
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: todo-secrets
          key: database-url
    - name: BETTER_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: todo-secrets
          key: auth-secret

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Backend (FastAPI) configuration
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: todo-backend
    pullPolicy: Never  # Use local images loaded into Minikube
    tag: "latest"

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: todo-secrets
          key: database-url
    - name: BETTER_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: todo-secrets
          key: auth-secret
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: todo-secrets
          key: openai-api-key
    - name: CORS_ORIGINS
      value: "http://localhost:30080,http://frontend-service:3000"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Secrets configuration (to be created via kubectl)
secrets:
  # These will be provided via kubectl create secret
  # Example: kubectl create secret generic todo-secrets \
  #   --from-literal=database-url='postgresql://...' \
  #   --from-literal=auth-secret='your-secret' \
  #   --from-literal=openai-api-key='sk-...'
  name: todo-secrets

# Service Account configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "todo-app-sa"

# Pod annotations and labels
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"

podLabels:
  app: todo-app
  version: phase-4

# Security context
podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

# Ingress configuration (disabled by default for Minikube)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: todo-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Autoscaling (disabled by default)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node selector, tolerations, and affinity
nodeSelector: {}
tolerations: []
affinity: {}
